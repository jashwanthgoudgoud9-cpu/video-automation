name: Run Automation

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Script
        run: |
          python3 main.py

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: output-files
          path: output/
